#====# Profiles #==================================================================================#

profile.Default = !NORMAL_MAPPING !SPECULAR_MAPPING EMISSIVE_MODE=0 SUBSURFACE_SCATTERING_MODE=0
profile.ResPBR  =  NORMAL_MAPPING  SPECULAR_MAPPING EMISSIVE_MODE=2 SUBSURFACE_SCATTERING_MODE=2

#====# Settings #==================================================================================#

screen = <profile>     <empty> \
		 <empty>       [Environment] \
		 INFO          [Lighting] \
		 AUTHOR        [Materials] \
		 <empty>       [PostProcessing] \
		 [Debug]       [Compatibility]

screen.Environment = [Atmospherics] [Weather] [Foliage]
screen.Environment.columns = 1

	screen.Atmospherics = PLANET_GROUND VIEWER_BASE_ALTITUDE ATMOSPHERE_THICKNESS \
						  SUN_RADIUS_MULT <empty> <empty> \
						  <empty> CLOUDS [Clouds] \
						  [Fog] GALAXY RAINBOWS \
						  STARS_COVERAGE GALAXY_SOLAR_POS RAINBOWS_PRIMARY_INTENSITY \
						  STARS_INTENSITY GALAXY_INTENSITY RAINBOWS_SECONDARY_INTENSITY
	screen.Atmospherics.columns = 3

		screen.Clouds = [CloudUpsampling] [CloudLighting] \
						<empty> <empty> \
						CLOUD_SHADOWS [LowLevelClouds] \
						CLOUD_SHADOW_DISTANCE [MidLevelClouds] \
						CLOUD_SHADOW_SAMPLES [HighLevelClouds] \
						CLOUD_SHADOW_STRENGTH

			screen.CloudUpsampling = CLOUD_TAAU_ENABLED CLOUD_TAAU_SCALE CLOUD_TAAU_CLIPPING CLOUD_MAX_ACCUM_FRAMES CLOUD_TAAU_ANTIFLICKER

			screen.CloudLighting =
			screen.CloudLighting.columns = 1

			screen.LowLevelClouds = CLOUD_CUMULUS CLOUD_LOW_SAMPLES CLOUD_LOW_SUNLIGHT_SAMPLES CLOUD_LOW_SKYLIGHT_SAMPLES <empty> <empty> CLOUD_CU_ALTITUDE CLOUD_CU_THICKNESS CLOUD_CU_DENSITY_B CLOUD_CU_DENSITY_T CLOUD_CU_COVERAGE CLOUD_LOW_WIND_SPEED

			# screen.MidLevelClouds = CLOUD_MID_ALTITUDE CLOUD_MID_THICKNESS CLOUD_MID_SUNLIGHT_SAMPLES <empty> CLOUD_ALTOSTRATUS CLOUD_AS_COVERAGE CLOUD_MID_WIND_SPEED

			screen.HighLevelClouds = CLOUD_HIGH_ALTITUDE CLOUD_HIGH_THICKNESS CLOUD_HIGH_SUNLIGHT_SAMPLES <empty> CLOUD_CIRRUS CLOUD_CIRROCUMULUS CLOUD_CI_COVERAGE CLOUD_CC_COVERAGE CLOUD_HIGH_WIND_SPEED

		screen.Fog = BORDER_FOG BORDER_FOG_FALLOFF BLOOMY_FOG BLOOMY_FOG_INTENSITY PER_BIOME_FOG [Volumetric] <empty> <empty> LAVA_FOG POWDERED_SNOW_FOG BLINDNESS_DARKNESS_FOG

			screen.Volumetric = VOLUMETRIC_FOG VF_CLOUD_SHADOWS VF_NOISE_QUALITY VF_TIME_FADE VF_MAX_SAMPLES VF_HEIGHT <empty> <empty> COLORED_VOLUMETRIC_FOG UW_VOLUMETRIC_FOG VF_RAYLEIGH_DENSITY VF_MIE_DENSITY UW_VF_MAX_SAMPLES VF_MIE_DENSITY_RAIN_MULT

	screen.Foliage = WAVING_FOLIAGE UNLABELLED_FOILAGE_DETECTION
	screen.Foliage.columns = 1

	screen.Weather = RAIN_PUDDLES RAIN_PUDDLE_SCALE RAIN_PUDDLE_SMOOTHNESS <empty> RAIN_VISIBILITY RAIN_SCALE_X RAIN_SCALE_Y VF_MIE_DENSITY_RAIN_MULT

screen.Lighting = [Shadows] [GlobalIllumination] [Reflections] [AmbientOcclusion] [Refractions] [MiscLighting]

	screen.GlobalIllumination = SSILVB_ENABLED SSILVB_SLICE_COUNT SSILVB_SAMPLE_COUNT SSILVB_SECTOR_COUNT SSILVB_HIT_THICKNESS SSILVB_BLENDED_LIGHTMAP SVGF_ENABLED SSILVB_MAX_ACCUM_FRAMES

	screen.AmbientOcclusion = AO_ENABLED AO_MULTI_BOUNCE <empty> <empty> SSAO_SAMPLES SSAO_STRENGTH GTAO_SLICES GTAO_DIRECTION_SAMPLES GTAO_RADIUS

	screen.Shadows = shadowMapResolution shadowDistance SHADOW_DISTORTION_STRENGTH PCSS_SEARCH_SAMPLES PCSS_FILTER_SAMPLES COLORED_SHADOWS SCREEN_SPACE_SHADOWS SHADOW_BACKFACE_CULLING SCREEN_SPACE_SHADOWS_SAMPLES CLOUD_SHADOWS PARALLAX_SHADOW

	screen.Reflections = ROUGH_REFLECTIONS ROUGH_REFLECTIONS_THRESHOLD REFLECTION_FILTER SSRT_REFINEMENT SSRT_MAX_SAMPLES SSRT_REFINEMENT_STEPS <empty> <empty> SSRT_SKY_TRACING SPECULAR_IMPORTANCE_SAMPLING_BIAS

	screen.Refractions = RAYTRACED_REFRACTION REFRACTION_STRENGTH

	screen.MiscLighting = sunPathRotation NIGHT_BRIGHTNESS HANDHELD_LIGHTING HELD_LIGHT_BRIGHTNESS BLOCKLIGHT_TEMPERATURE MINIMUM_AMBIENT_BRIGHTNESS

screen.Materials = TEXTURE_FORMAT MOD_BLOCK_SUPPORT \
				   <empty> [Normal] \
				   NORMAL_MAPPING [Parallax] \
				   SPECULAR_MAPPING [Emissive] \
				   <empty> [SubsurfaceScattering] \
				   [Transparent] [MiscMaterials]

	screen.Normal = AUTO_GENERATED_NORMAL AGN_STRENGTH AGN_RESOLUTION
	screen.Normal.columns = 1

	screen.Parallax = PARALLAX PARALLAX_DEPTH_WRITE <empty> <empty> PARALLAX_DEPTH PARALLAX_REFINEMENT PARALLAX_SAMPLES PARALLAX_REFINEMENT_STEPS PARALLAX_SHADOW PARALLAX_BASED_NORMAL

	screen.Emissive = EMISSIVE_MODE EMISSIVE_BRIGHTNESS EMISSIVE_CURVE
	screen.Emissive.columns = 1

	screen.SubsurfaceScattering = SUBSURFACE_SCATTERING_MODE SUBSURFACE_SCATTERING_STRENGTH SUBSURFACE_SCATTERING_BRIGHTNESS SUBSURFACE_SCATTERING_RADIUS
	screen.SubsurfaceScattering.columns = 1

	screen.Transparent = WATER_PARALLAX WATER_CAUSTICS <empty> <empty> [WaterParams] GLASS_IOR TRANSLUCENT_ROUGHNESS

		screen.WaterParams = WATER_IOR WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_FOG_DENSITY WATER_ABSORPTION_R WATER_SCATTERING_R WATER_ABSORPTION_G WATER_SCATTERING_G WATER_ABSORPTION_B WATER_SCATTERING_B

	screen.MiscMaterials = DEFAULT_DIELECTRIC_F0 SELECTION_BOX_WIDTH SELECTION_BOX_COLOR_R SELECTION_BOX_COLOR_G SELECTION_BOX_COLOR_B
	screen.MiscMaterials.columns = 1

screen.PostProcessing = [FidelityFX] <empty> <empty> [DoF] [TAA] [MotionBlur] [Bloom] [Exposure] [Vignette] [Color]

	screen.FidelityFX = CAS_ENABLED CAS_STRENGTH

	screen.DoF =

	screen.TAA = TAA_ENABLED TAA_CLOSEST_FRAGMENT TAA_SHARPEN TAA_CLIPPING TAA_MAX_ACCUM_FRAMES TAA_AGGRESSION TAA_ANTIFLICKER

	screen.MotionBlur = MOTION_BLUR MOTION_BLUR_SAMPLES MOTION_BLUR_STRENGTH
	screen.MotionBlur.columns = 1

	screen.Bloom = BLOOM_ENABLED BLOOM_BLUR_SAMPLES BLOOM_INTENSITY <empty> BLOOMY_FOG BLOOMY_FOG_INTENSITY
	screen.Bloom.columns = 1

	screen.Exposure = EXPOSURE_MODE MANUAL_EV <empty> <empty> AUTO_EV_MIN EXPOSURE_SPEED_UP AUTO_EV_MAX EXPOSURE_SPEED_DOWN AUTO_EV_BIAS HISTOGRAM_BIN_COUNT HISTOGRAM_LOWER_BOUND HISTOGRAM_UPPER_BOUND

	screen.Vignette = VIGNETTE_ENABLED VIGNETTE_STRENGTH VIGNETTE_ROUNDNESS
	screen.Vignette.columns = 1

	screen.Color = TONE_MAPPER AGX_LOOK PURKINJE_SHIFT PURKINJE_SHIFT_STRENGTH

screen.Compatibility = MOD_BLOCK_SUPPORT PHYSICS_OCEAN_SUPPORT FORCE_DISABLE_SUBGROUP_OPS

screen.Debug = WHITE_WORLD DEBUG_NORMALS DEBUG_SKY_MAP DEBUG_BLOOM_TILES DEBUG_CLOUD_MAP DEBUG_CLOUD_NOISE DEBUG_CLOUD_SHADOWS DEBUG_SKY_COLOR DEBUG_RESHADING


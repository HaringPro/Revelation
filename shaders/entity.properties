# Display ID = property ID - 10000. See lib/utility/MaterialID.glsl.
# Low 6 bits select the surface or emission profile. Banks 0/64/128/192 select ordinary, scattering, static foliage and rooted foliage.

# Luminous entities and projectiles
entity.10017 = allay vex experience_orb dragon_fireball fireball small_fireball shulker_bullet spectral_arrow eye_of_ender firework_rocket \
    ender_pearl experience_bottle wind_charge breeze_wind_charge ominous_item_spawner

# Fire and energy
entity.10018 = entity_flame blaze end_crystal_beam

# The ghast's attack texture has red eyes and an open red mouth.
entity.10023 = ghast

# Animated cyan spots, tendrils and heart
entity.10028 = warden

# Lightning
entity.10049 = lightning_bolt

# Molten core
entity.10050 = magma_cube

# End crystal cage and bedrock base share the draw with its pink core.
entity.10052 = end_crystal

# Entities with luminous details
entity.10055 = glow_item_frame wither wither_skull

# The beam uses a monochrome sprite multiplied by the attack color.
entity.10056 = guardian elder_guardian

# Vanilla lowers the squid's block light while its glow recovers after damage.
entity.10058 = glow_squid

# Only the blue energy layer of a charged creeper emits.
entity.10121 = creeper

# Weak transmission
entity.10065 = chicken frog pig cow sheep horse polar_bear giant squid zombie zombie_villager zombie_horse snow_golem

# Strong transmission
entity.10066 = slime

